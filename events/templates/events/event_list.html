{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">Events</h2>
<a href="{% url 'add_event' %}" class="btn btn-primary mb-3">+ Add Event</a>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Date</th>
            <th>Location</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for event in events %}
        <tr>
            <td>{{ event.title }}</td>
            <td>{{ event.date }}</td>
            <td>{{ event.location }}</td>
            <td>
                <a href="{% url 'edit_event' event.id %}" class="btn btn-warning btn-sm">Edit</a>
                <a href="{% url 'delete_event' event.id %}" class="btn btn-danger btn-sm">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No events found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
