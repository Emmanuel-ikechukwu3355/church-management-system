{% extends 'base.html' %}

{% block content %}

<h2 class="mb-3">{{ title }}</h2>

<form method="POST">
    {% csrf_token %}
    <div class="mb-3">
        {{ form.title.label_tag }}
        {{ form.title }}
    </div>
    <div class="mb-3">
        {{ form.date.label_tag }}
        {{ form.date }}
    </div>
    <div class="mb-3">
        {{ form.location.label_tag }}
        {{ form.location }}
    </div>
    <div class="mb-3">
        {{ form.description.label_tag }}
        {{ form.description }}
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'event_list' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
