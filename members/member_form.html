{% extends 'base.html' %}

{% block content %}

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{{ title }}</h2>

        <a href="{% url 'member_list' %}" class="btn btn-secondary">
            Back to Members
        </a>
    </div>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-3">

                    <button type="submit" class="btn btn-primary">
                        Save Member
                    </button>

                    <a
                        href="{% url 'member_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
